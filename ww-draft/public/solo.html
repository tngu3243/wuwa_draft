<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WuWa Draft · Play vs Bot</title>
<style>
:root{color-scheme:dark;--bg:#0f2229;--panel:#16323b;--line:#2a4b56;--tx:#e8f0f2;--mute:#8fa9b2;--cy:#5ee0e6;--a:#f2b84b;--b:#a98bff;--bad:#ff7a7a;--ok:#7be0a0}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,sans-serif}main{max-width:1000px;margin:auto;padding:20px 16px 48px}header,.row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}header{justify-content:space-between;margin-bottom:16px}h1,h2,h3{margin:0}h1{font-size:25px}.mute{color:var(--mute)}.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;margin:12px 0}.row>*{flex:1}button,input{font:inherit;color:inherit}button{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:8px 12px;cursor:pointer}button:hover:not(:disabled){border-color:var(--cy)}button:disabled{opacity:.45;cursor:default}button.go{background:var(--cy);color:#06242a;font-weight:700}input{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:8px;width:100%}.cols{display:grid;grid-template-columns:1fr 1.4fr 1fr;gap:12px}@media(max-width:750px){.cols{grid-template-columns:1fr}}.roster{display:grid;grid-template-columns:repeat(auto-fill,minmax(125px,1fr));gap:6px;max-height:430px;overflow:auto;margin-top:10px}.roster button{text-align:left;font-size:13px}.chip{display:inline-block;padding:3px 9px;margin:0 4px 4px 0;border-radius:999px;border:1px solid var(--line);font-size:13px}.x{text-decoration:line-through;color:var(--bad);border-color:var(--bad)}.keep{border-color:var(--ok)}.A{color:var(--a)}.B{color:var(--b)}.bosses{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}.boss{border:1px solid var(--line);border-radius:8px;padding:8px}.score{font-size:36px;font-weight:700}table{border-collapse:collapse;width:100%;min-width:500px}td,th{padding:7px;border-bottom:1px solid var(--line);text-align:left}td input{width:95px}.tbl{overflow:auto}.banner{border-left:4px solid var(--cy)}code{background:var(--bg);padding:2px 6px;border-radius:4px}a{color:var(--cy)}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--bad);padding:8px 14px;border-radius:8px}
</style>
</head>
<body><main>
<header><div><h1>Round 2 · 1v1 BO5</h1><div id="status" class="mute">Connecting…</div></div><a href="/multiplayer">Open multiplayer mode</a></header>
<div id="app"></div>
<script>
const $=id=>document.getElementById(id), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const store=sessionStorage, humanId=store.bot_human_id||(store.bot_human_id='human-'+Math.random().toString(36).slice(2)+Date.now().toString(36)), botId='bot-'+humanId;
let human,bot,state=null,botState=null,connected=false,botConnected=false,botTimer=0,botDone='',name=store.ww_name||'Player',filter='';
const send=(sock,msg)=>sock&&sock.readyState===1&&sock.send(JSON.stringify(msg));
function connect(){human=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host);human.onopen=()=>{connected=true;$('status').textContent='Connected';};human.onmessage=e=>{const m=JSON.parse(e.data);if(m.type==='state'){state=m.state;render();}else if(m.type==='error')toast(m.msg)};human.onclose=()=>{connected=false;$('status').textContent='Reconnecting…';setTimeout(connect,1500)};}
function connectBot(code){if(bot&&bot.readyState<2)return;bot=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host);bot.onopen=()=>{botConnected=true;send(bot,{type:'join',id:botId,room:code,name:'Tier Bot',role:'player'});};bot.onmessage=e=>{const m=JSON.parse(e.data);if(m.type==='state'){botState=m.state;maybeBotAct();render();}};bot.onclose=()=>{botConnected=false;botState=null;};}
function join(){name=$('name').value.trim()||'Player';store.ww_name=name;send(human,{type:'join',id:humanId,name,role:'player'});}
function toast(s){document.querySelector('.toast')?.remove();const d=document.createElement('div');d.className='toast';d.textContent=s;document.body.append(d);setTimeout(()=>d.remove(),2600)}
const h=(s)=>esc(state?.names?.[s]||s), chips=(arr,cls='')=>arr.map(x=>`<span class="chip ${cls}">${esc(x)}</span>`).join('')||'<span class="mute">None yet</span>';
// Preliminary, hand-seeded Prydwen-inspired priorities. Unlisted characters use a neutral score.
// This intentionally stays local/static: tier positions can change and should be refreshed manually.
const TIER={
 'Shorekeeper':100,'Hiyuki':100,'Suisui':100,'Lynae':100,'Yangyang: Xuanling':100,'Aemeath':100,'Lucilla':100,'Sigrika':100,'Qingxiao':100,'Hsin':100,'Jingran':100,
 'Mornye':85,'Iuno':85,'Phrolova':85,'Verina':85,'Augusta':85,'Lupa':85,'Denia':85,'Cartethyia':85,'Chisa':85,'Lucy':85,'Rebecca':85,'Galbrena':85,'Sanhua':85,'Luuk Herssen':85,'Ciaccona':85,'Qiuyuan':85,
 'Suoming':65,'Carlotta':65,'Changli':65,'Yinlin':65,'Camellya':65,'Zhezhi':65,'Mortefi':65,'Cantarella':65,'Jinhsi':65,'Brant':65,'Zani':65,'Jiyan':65,'Xiangli Yao':65,'Roccia':65,'Buling':65,
 'Phoebe':45,'Rover (Spectro)':45,'Rover (Havoc)':45,'Rover (Aero)':45,'Rover (Electro)':45,'Encore':45,'Baizhi':45,'Calcharo':45,'Danjin':45,'Jianxin':45,'Chixia':45,
 'Yangyang':25,'Lingyang':25,'Taoqi':25,'Yuanwu':25,'Youhu':25,'Lumi':25,'Aalto':25
};
const rating=c=>TIER[c]??55;
function maybeBotAct(){if(!botState?.canAct||botState.phase!=='draft')return;const key=botState.code+':'+botState.i;if(botDone===key)return;botDone=key;clearTimeout(botTimer);botTimer=setTimeout(()=>{if(!botState?.canAct||botState.code+':'+botState.i!==key)return;const s=botState.steps[botState.i],choices=[...botState.avail];if(!choices.length)return;choices.sort((a,b)=>{const d=rating(a)-rating(b);return s.t==='tban'?d||a.localeCompare(b): -d||a.localeCompare(b)});send(bot,{type:'act',c:choices[0]});},650);}
function landing(){return`<div class="card"><h2>Play against the tier bot</h2><p class="mute">The bot joins as the second player, takes its turns automatically, and uses a preliminary Prydwen-inspired tier priority for bans and picks. You can play remotely by opening this hosted page.</p><div class="row"><label>Your name<input id="name" maxlength="24" value="${esc(name)}"></label><button class="go" id="create" ${connected?'':'disabled'}>Start solo draft</button></div><p class="mute">Bot rankings are a hand-seeded starting point, not a live Prydwen feed. <a href="https://www.prydwen.gg/wuthering-waves/tier-list/" target="_blank" rel="noreferrer">Check Prydwen’s current tier list</a>.</p></div>`}
function lobby(){const p=state.players;return`<div class="card"><h2>Solo room <code>${state.code}</code></h2><p><b>${esc(p.p1?.name||name)}</b> vs <b>${esc(p.p2?.name||'Waiting for bot…')}</b></p><div class="mute">Bosses, same order for each player</div><div class="bosses">${state.bosses.map((b,i)=>`<div class="boss"><span class="mute">Game ${i+1}</span><br><b>${esc(b)}</b></div>`).join('')}</div><div class="row" style="margin-top:12px"><label>Seed matchup<select id="seed">${state.seeds.map((x,i)=>`<option value="${i}"${i===state.seed?' selected':''}>${esc(x)}</option>`).join('')}</select></label><button id="reroll">Reroll bosses</button><button class="go" id="start" ${p.p1&&p.p2?'':'disabled'}>Draw A / B and start</button></div></div>`}
function draft(){const s=state.steps[state.i],labels={ban:'Initial ban',pick:'Pick',tban:'Team ban'},hint={ban:'Choose a character nobody can use.',pick:'Choose a character for your pool.',tban:`Ban a character from ${h(s.p==='A'?'B':'A')}’s pool.`};const list=state.canAct?state.avail.filter(c=>s.t==='tban'||c.toLowerCase().includes(filter.toLowerCase())):[];return`<div class="bosses">${state.bosses.map((b,i)=>`<div class="boss"><span class="mute">Game ${i+1}</span><br>${esc(b)}</div>`).join('')}</div><div class="card banner"><h2 class="${s.p}">${labels[s.t]} · ${h(s.p)} (Player ${s.p})</h2><div class="mute">${state.canAct?hint[s.t]:`Waiting for ${h(s.p)}.`} Step ${state.i+1} of ${state.steps.length}. You are Player ${state.you.side||'?'}. Bot: ${botConnected?'connected':'connecting…'}</div></div><div class="cols"><div class="card"><h3 class="A">${h('A')} · A (${state.pick.A.length}/9)</h3>${chips(state.pick.A)}</div><div class="card">${state.canAct?`${s.t==='tban'?'':'<input id="filter" placeholder="Search characters" value="'+esc(filter)+'">'}<div class="roster">${list.map(c=>`<button data-char="${esc(c)}">${esc(c)} <small class="mute">${rating(c)}</small></button>`).join('')||'<span class="mute">No match</span>'}</div>`:'<p class="mute">Waiting for the active player…</p>'}</div><div class="card"><h3 class="B">${h('B')} · B (${state.pick.B.length}/9)</h3>${chips(state.pick.B)}</div></div><div class="card"><div class="mute">Initial bans</div>${chips(state.ban,'x')}<div class="mute">Team bans</div>${chips([...state.tban.A,...state.tban.B],'x')}</div>`}
function match(){const pool=p=>state.pick[p].map(c=>`<span class="chip ${state.tban[p==='A'?'B':'A'].includes(c)?'x':'keep'}">${esc(c)}</span>`).join('');return`<div class="cols"><div class="card"><h3 class="A">${h('A')} · available 7</h3>${pool('A')}</div><div class="card"><h3 class="B">${h('B')} · available 7</h3>${pool('B')}</div></div><div class="card"><h2>Match · <span class="A">${state.wins.A}</span> – <span class="B">${state.wins.B}</span></h2><p class="mute">Enter your time (1:23.4 or 83.4 seconds), or x for a failed clear.</p>${state.winner?`<h2>${h(state.winner)} wins the match</h2>`:''}<div class="tbl"><table><tr><th>Game</th><th>Boss</th><th class="A">${h('A')}</th><th class="B">${h('B')}</th><th>Result</th></tr>${state.bosses.map((b,i)=>{const cell=side=>state.you.side===side?`<input data-game="${i}" data-side="${side}" value="${esc(state.t[i][side])}">`:esc(state.t[i][side])||'–';const r=state.results[i];return`<tr><td>${i+1}</td><td>${esc(b)}</td><td>${cell('A')}</td><td>${cell('B')}</td><td>${r==='void'?'Voided':r?`${h(r)} wins`:'–'}</td></tr>`}).join('')}</table></div></div>`}
function render(){if(!connected)$('status').textContent='Reconnecting…';else $('status').textContent=state?`Connected · Room ${state.code}`:'Connected';const app=$('app');if(!state){app.innerHTML=landing();$('create')?.addEventListener('click',()=>{store.ww_name=$('name').value.trim()||'Player';name=store.ww_name;send(human,{type:'join',id:humanId,name,role:'player'});});return;}if(state.phase==='lobby'&&state.you.isHost&&!botState)connectBot(state.code);app.innerHTML=state.phase==='lobby'?lobby():state.phase==='draft'?draft():match();if(state.phase==='lobby'&&state.you.isHost){$('seed').onchange=e=>send(human,{type:'seed',v:+e.target.value});$('reroll').onclick=()=>send(human,{type:'reroll'});$('start').onclick=()=>send(human,{type:'start'});}if(state.phase==='draft'&&state.canAct){app.querySelectorAll('[data-char]').forEach(b=>b.onclick=()=>send(human,{type:'act',c:b.dataset.char}));const inp=$('filter');if(inp)inp.oninput=e=>{filter=e.target.value;render();$('filter').focus();};}if(state.phase==='match')app.querySelectorAll('[data-game]').forEach(i=>i.onchange=e=>send(human,{type:'time',g:+e.target.dataset.game,side:e.target.dataset.side,v:e.target.value}));}
connect();
</script></main></body></html>
